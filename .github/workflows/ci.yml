name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 第一道防线是 .gitignore 与人工检查；CI 再兜一层，确保 temp/ 永不入库。
      - name: 禁止 temp/ 入库
        run: |
          if git ls-files 'temp/' | grep -q .; then
            echo "::error::temp/ 下的文件被提交了（见 CLAUDE.md §0）"
            git ls-files 'temp/'
            exit 1
          fi
          echo "temp/ 未被跟踪，OK"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy（warnings 视为错误）
        run: cargo clippy --all-targets -- -D warnings

      # 部分测试要求 tests/fixtures/generated/ 下的样本，而样本按 §0.2 不入库。
      # 原先这些测试在 CI 上直接 panic（"缺少 fixture"），于是"测试闸门"永远是红的。
      # 这里现场生成一次：ubuntu 自带 pwsh 与 clang，补齐 gcc-mingw-w64 后脚本即可产出
      # m3-mingw-static.exe 等 PE 样本。
      - name: 生成测试样本
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          pwsh -File scripts/gen-fixtures.ps1

      - name: 单元与集成测试
        run: |
          # GitHub Actions 用 `bash -e` 跑每一步，`set -uo pipefail` 并不会关掉 -e。
          # 上一版正是栽在这里：`cargo test` 一失败，整个步骤带着 101 直接退出，
          # 下面那段"缺 fixture 可数降级"一行都没跑到 —— 日志里连两个计数都没出现。
          # 所以必须用 `|| code=$?` 显式接住失败，计数逻辑才真的执行。
          log=/tmp/cargo-test.log
          code=0
          cargo test --workspace > "$log" 2>&1 || code=$?
          cat "$log" || true
          if [ "$code" -eq 0 ]; then
            echo "cargo test 全绿"
            exit 0
          fi

          # 少数测试依赖 Windows 开发机上生成的 golden 样本（m3-mingw-static.exe 等），
          # 这些样本按 §0.2 不入库，gen-fixtures.ps1 也不产出。把它们当作"跳过"必须
          # **可数、可区分**（§7）：只有"每一个失败测试都是因为缺 fixture"时才降级。
          #
          # failed  = libtest 打出的 `test <名字> ... FAILED` 行数；
          # missing = 失败测试自己的 stdout 块里出现 fixture 缺失标记的块数
          #           （一块最多记一次，所以 missing 恒 <= failed）。
          # 两者相等就说明没有别的失败；只要有一条别的失败，等式就破，照样红。
          failed=$(grep -cE '^test .*\.\.\. FAILED$' "$log" || true)
          missing=$(awk '
            /^---- .* stdout ----$/ { inblock = 1; next }
            /^---- .* stderr ----$/ { inblock = 0; next }
            /^note: run with / { inblock = 0; next }
            inblock && /缺少 fixture|跳过：fixture/ { count++; inblock = 0 }
            END { print count + 0 }
          ' "$log")
          echo "cargo test 退出码=$code"
          echo "failed=$failed missing=$missing"
          if [ "$failed" -gt 0 ] && [ "$failed" -eq "$missing" ]; then
            echo "::warning::$failed 个测试因缺少本地 golden 样本被跳过（这不是通过）"
            grep -E '^test .*\.\.\. FAILED$' "$log" | sed 's/^/  skipped: /'
            exit 0
          fi
          echo "::error::cargo test 退出码 $code：$failed 个测试 FAILED，其中只有 $missing 条是缺 fixture"
          grep -E '^test .*\.\.\. FAILED$' "$log" | sed 's/^/  失败: /' || true
          exit 1

      # 这两道闸门原先只在本机手工跑。它们要扫全仓，挪到 CI 才是该待的地方 ——
      # 低配机上本机只跑受影响范围的小测试。
      - name: 依赖许可闸门
        run: python scripts/check-licenses.py

      - name: 架构分层检查
        shell: pwsh
        run: ./scripts/check-arch-layering.ps1

  bundle:
    name: 端到端（构建 SPA + 内嵌 + 服务冒烟）
    runs-on: ubuntu-latest
    env:
      # 仓库的 .cargo/config.toml 把 target-dir 钉在 ".cargo-target"（CLAUDE.md §3：
      # 构建产物必须留在仓库内，本机 C: 只剩约 2.8GB）。所以 cargo 的产物不在默认的
      # ./target 下。下面这些步骤原先一律按 ./target/release/... 调用，实际拿到的是
      # ".../target/release/bitflip-cli: No such file or directory"（exit 127）——
      # 看着像缺工具，其实是路径。统一从这里取，别再散落到各步里。
      BIN: .cargo-target/release
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 构建二进制（此时 dist 已存在，会被内嵌）
        run: |
          cargo build --release -p bitflip-app -p bitflip-cli
          # 路径一旦漂到 ./target，下面每一步都会以 127 收场且没人看得懂原因。
          # 在这里断言一次，让漂移在它真正发生的那一步就红。
          ls -l "$BIN/bitflip-cli" "$BIN/bitflip"

      - name: 生成的样本可被识别
        run: |
          mkdir -p tests/fixtures/generated
          printf 'const char *bf = "ci";\nint bf_add(int a,int b){return a+b;}\n' > /tmp/sample.c
          clang -c /tmp/sample.c -o tests/fixtures/generated/elf-x86_64.o
          clang -c --target=aarch64-unknown-linux-gnu /tmp/sample.c -o tests/fixtures/generated/elf-aarch64.o
          # 用 binutils 的 `ar`，不要 `llvm-ar`：ubuntu 运行器上 clang 有，但 llvm 工具组
          # 没装，`llvm-ar` 会 exit 127（这条闸门因此一直红）。这里只是造一个 .a 给 info 用。
          ar rcs tests/fixtures/generated/libelf.a tests/fixtures/generated/elf-x86_64.o
          ${BIN}/bitflip-cli info tests/fixtures/generated/libelf.a

      - name: 服务冒烟测试（令牌 + Origin）
        run: |
          set -euo pipefail
          ${BIN}/bitflip-cli serve tests/fixtures/generated/elf-x86_64.o \
            --no-open --port 8790 --token ci-token &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8790/; then break; fi
            sleep 0.5
          done

          echo "--- 带令牌：期望 200"
          curl -sf -H 'X-BitFlip-Token: ci-token' http://127.0.0.1:8790/api/health | tee /dev/stderr | grep -q '"ok":true'

          echo "--- 无令牌：期望 403"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8790/api/health)
          test "$code" = "403" || { echo "期望 403，实际 $code"; exit 1; }

          echo "--- 恶意 Origin：期望 403"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-BitFlip-Token: ci-token' -H 'Origin: http://evil.example' \
            http://127.0.0.1:8790/api/health)
          test "$code" = "403" || { echo "期望 403，实际 $code"; exit 1; }

      - name: 只绑定回环地址
        run: |
          set -euo pipefail
          # 「只绑回环」是 README 里的安全承诺，必须对着真实监听套接字验证，
          # 而不是只检查 CLI 的默认值。
          lan_ip=$(hostname -I | awk '{print $1}')
          if [ -z "$lan_ip" ]; then
            echo "无法确定非回环地址，跳过"; exit 0
          fi
          # 用 8795：与上面那两个步骤的端口（8790 及其回退位 8791）隔开，
          # 避免步骤之间抢端口导致偶发失败。
          ${BIN}/bitflip-cli serve tests/fixtures/generated/elf-x86_64.o \
            --no-open --port 8795 --token bind-token &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8795/; then break; fi
            sleep 0.5
          done

          echo "--- 回环地址：期望可达"
          curl -sf -H 'X-BitFlip-Token: bind-token' http://127.0.0.1:8795/api/health >/dev/null

          echo "--- 非回环地址 $lan_ip：期望不可达"
          if curl -sf --max-time 5 -o /dev/null "http://$lan_ip:8795/"; then
            echo "失败：服务在 $lan_ip 上可达，违反只绑回环的承诺"; exit 1
          fi
          echo "OK：$lan_ip 不可达"

      - name: bitflip <target> 可起服务（用户实际入口）
        run: |
          set -euo pipefail
          # 这是 README 里告诉用户的第一条命令，必须真的能起服务。
          # 用 --no-open：CI 无浏览器，否则 open_url 会失败（虽然它会降级，但没必要）。
          ${BIN}/bitflip tests/fixtures/generated/elf-x86_64.o \
            --no-open --port 8796 --token entry-token > /tmp/entry.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8796/; then break; fi
            sleep 0.5
          done

          cat /tmp/entry.log
          curl -sf -H 'X-BitFlip-Token: entry-token' http://127.0.0.1:8796/api/health | grep -q '"ok":true'
          # 横幅里的 URL 必须带片段令牌，否则用户点进去会被 403 挡住
          grep -q '#token=entry-token' /tmp/entry.log

      - name: 前端确实被内嵌
        run: ${BIN}/bitflip-cli version | grep -q '已内嵌'
