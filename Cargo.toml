[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
# 1.87 是 `rquickjs` 的 MSRV（ADR-0013 选定的脚本引擎）。继续声明更低的版本
# 会变成一句谎话：装到 1.85 的机器上根本编不过。
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitflip/bitflip"
homepage = "https://github.com/bitflip/bitflip"
keywords = ["reverse-engineering", "disassembler", "pe", "elf", "static-analysis"]
categories = ["development-tools::debugging"]

[workspace.dependencies]
# 内部 crate
bitflip-arch = { path = "crates/bitflip-arch", version = "0.0.1" }
bitflip-loader = { path = "crates/bitflip-loader", version = "0.0.1" }
bitflip-analyze = { path = "crates/bitflip-analyze", version = "0.0.1" }
bitflip-symbols = { path = "crates/bitflip-symbols", version = "0.0.1" }
bitflip-signature = { path = "crates/bitflip-signature", version = "0.0.1" }
bitflip-debug = { path = "crates/bitflip-debug", version = "0.0.1" }
bitflip-project = { path = "crates/bitflip-project", version = "0.0.1" }
bitflip-core = { path = "crates/bitflip-core", version = "0.0.1" }
bitflip-script = { path = "crates/bitflip-script", version = "0.0.1" }
bitflip-server = { path = "crates/bitflip-server", version = "0.0.1" }
bitflip-cli = { path = "crates/bitflip-cli", version = "0.0.1" }

# 外部依赖（版本与 docs/DECISIONS.md 一致）
anyhow = "1"
axum = "0.8"
capstone = "0.14"
# DWARF/PDB 解析（M8 交付物 1）。gimli 是纯 Rust、无 unsafe、无 C 依赖；pdb 同理，
# 两者都只做读取，不引入任何运行期外部工具（交付形态仍是单文件可执行）。
gimli = "0.31"
pdb = "0.8"
clap = { version = "4", features = ["derive", "env"] }
mime_guess = "2"
rand = "0.8"
rayon = "1"
# 脚本引擎（ADR-0013）。刻意不写 `default-features = false`：
# rquickjs 的 default 就是 `std`，先只开它。`full` 会额外拉进
# chrono / loader / dyn-load / either / indexmap / phf —— 这些在 M7
# 的宿主 API 里用不上，不该为了"以后可能要"先付编译时间。
rquickjs = "0.14"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# ZIP/APK 容器（M11 的 M0）。**刻意关掉 default**：默认集会一次拉进
# aes-crypto / bzip2 / deflate64 / lzma / ppmd / zstd / xz 七套解压后端与
# 时间库，而 APK 成员实测只有 stored 与 deflate 两种（37/37、20/20 全是
# deflate，见 docs/research/apk-dex-library-survey.md）。
# 后端选 `-zlib-rs` 而不是 `-zlib`：前者是纯 Rust，不引入 C 工具链依赖，
# 保持"单文件可执行"的交付形态。`deflate-flate2` 会带上 `_deflate-any`，
# 所以这一个 feature 就够读，不需要 `deflate`（那个还会拉 zopfli，只用于写）。
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# DEX 解析（M11 的 M1）。BSD-3-Clause —— 与三个"很对口但许可不可用"的轮子
# （exe / dotnetdll / **smali**）不同：smali 正好是 DEX 那条 GPL-3.0-only，
# 它一被否掉，"自研 DEX 解析器"就成了当时的唯一出路；换成这个之后自研的
# 动因消失（ADR-0019 已就此更正：错在没先搜 crates.io 就下了"必须自研"的结论）。
#
# **只用它的事实层**（`parser` / `ids` / `decode`）。它的 `emit*` / `sugar` /
# `r8_inversion` 是反编译与推断 —— 接进来等于把"推断"混进"事实"，
# 而 BitFlip 的立身之本就是"说的就是真的"（CLAUDE.md §7）。
# 这条线不是口头约定，有 grep 守卫：
# crates/bitflip-loader/tests/dex_library_boundary.rs。
#
# 构建期安不安全：它的 `build.rs` 只读**本 crate 内**的文件做锁步校验，
# 不联网、不写外部路径（`lief` 就是因为在构建期下载才被否掉的）。
droidsaw-dex = "2"

# 仅测试用
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# DEX 合成样本要按规范算 `header.signature`（SHA-1）。版本与 `droidsaw-dex`
# 用它的一致，免得同一个哈希算法在依赖图里出现两份实现。
sha1 = "0.11"

[workspace.lints.rust]
unsafe_code = "deny"
# M0 起允许缺失文档（公共 API 的文档在 M1 补齐后收紧为 warn）。
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# pedantic 留到 M1 稳定后按需逐条开启；一次全开会把真实问题淹没在噪音里。

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

# `capstone` 0.14.0 的 aarch64 操作数转换会**中止进程**，这里用本地副本替换。
#
# 问题：`src/arch/arm64.rs` 把 capstone 给的原始系统寄存器编码
# `mem::transmute` 成 `Arm64Sysreg`。该枚举是稀疏的 `#[repr(u32)]`
# （只有 0 与 49k~62k 段那些具名编码），而 capstone 的 C 端
# （`printMRSSystemRegister`，AArch64InstPrinter.c）**不校验**就写
# `op.reg = Val`。于是任何它没命名的编码都会让 transmute 构造出非法枚举值
# —— 那是**非展开** panic：进程直接 abort。
#
# 为什么必须修：aarch64 是 Android 主 ABI，而 abort 连 §4 要求的
# `catch_unwind` 都兜不住（非展开 panic 直接进 abort，栈不回退）。
# 实测：真实上架 APK 里的 `lib/arm64-v8a/*.so` 一律中止进程。
# 上游没有更新的版本可用（0.14.0 就是 crates.io 最新）。
#
# 修法与升级步骤见 third-party/capstone/PATCH.md。
[patch.crates-io]
capstone = { path = "third-party/capstone" }
