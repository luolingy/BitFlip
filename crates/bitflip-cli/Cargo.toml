[package]
name = "bitflip-cli"
description = "BitFlip 的命令行：gui 入口与无头子命令"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "bitflip-cli"
path = "src/main.rs"

[dependencies]
bitflip-core = { workspace = true }
bitflip-server = { workspace = true }
bitflip-signature = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }
# DEX 合成样本要按规范自己算 `header.signature`（SHA-1）。用 `sha1` 而不是自己写一份：
# `droidsaw-dex` 用的就是它，两个不同实现之间的差异会变成一条难查的假失败。
# 它不是新依赖 —— 已经在传递依赖里，许可闸门早已覆盖。
sha1 = { workspace = true }

[lints]
workspace = true
