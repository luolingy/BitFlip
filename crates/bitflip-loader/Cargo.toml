[package]
name = "bitflip-loader"
description = "BitFlip 的容器与对象格式解析层（PE/COFF、ELF、ar/MSVC .lib、ZIP/APK、raw）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bitflip-arch = { workspace = true }
# AXML/ARSC 的事实层（M11 · M3）。选型理由与本 crate 的"只用事实层"边界
# 都写在 workspace 的 Cargo.toml 里，这里只留一句：**不接它的转换器**。
apk-info-axml = { workspace = true }
# `Element`（AXML 的元素/属性树）来自这里 —— 我们直接遍历它，理由见 workspace 清单。
apk-info-xml = { workspace = true }
droidsaw-dex = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }
# 代码签名完整性校验要按 CodeDirectory 的 hashType 重算 SHA-1 / SHA-256。
# 两个 crate 都已在 workspace 依赖清单里、许可闸门早已覆盖；**刻意与 droidsaw-dex /
# 其它实现用同一套**（sha1 0.11 / sha2 0.11），免得"另一个哈希实现"引入难查的假失败。
sha1 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
