[package]
name = "bitflip-loader"
description = "BitFlip 的容器与对象格式解析层（PE/COFF、ELF、ar/MSVC .lib、ZIP/APK、raw）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bitflip-arch = { workspace = true }
# AXML/ARSC 的事实层（M11 · M3）。选型理由与本 crate 的"只用事实层"边界
# 都写在 workspace 的 Cargo.toml 里，这里只留一句：**不接它的转换器**。
apk-info-axml = { workspace = true }
# `Element`（AXML 的元素/属性树）来自这里 —— 我们直接遍历它，理由见 workspace 清单。
apk-info-xml = { workspace = true }
droidsaw-dex = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
# DEX 合成样本要按规范自己算 `header.signature`（SHA-1）。**刻意用同一个 crate**：
# `droidsaw-dex` 用的就是 `sha1` 0.11，两个"另一个实现"之间的差异会变成
# 一条难查的假失败。它不是新增依赖 —— 已经在传递依赖里，许可闸门早已覆盖。
sha1 = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
