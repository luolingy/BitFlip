[package]
name = "bitflip-core"
description = "BitFlip 引擎门面：打开目标、查询、标注、导出（对外稳定 API）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bitflip-analyze = { workspace = true }
bitflip-arch = { workspace = true }
bitflip-debug = { workspace = true }
bitflip-loader = { workspace = true }
bitflip-project = { workspace = true }
bitflip-signature = { workspace = true }
bitflip-symbols.workspace = true
serde = { workspace = true }
# 导出（M9）要用它序列化。**刻意不做成 feature**：JSON 导出是交付物的一部分，
# 不是可选项 —— 做成 optional 只会让"导不出来"变成一种编译期配置。
serde_json = { workspace = true }
# 差分的函数体哈希（`diff.rs`）。用 SHA-256 而不是自己写个 64 位散列：
# 哈希在这里是"两段代码是否逐字节相同"的判据，碰撞意味着把改动报成未变，
# 也就是**漏报**——最不能容忍的一类错误。工作区里已经有这个依赖
# （`bitflip-signature` 在用），没有引入新的外部面。
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1.11.0"
tempfile = { workspace = true }
# DEX 合成样本（`tests/common/dex_fixture.rs`，与 CLI / server 共用同一份）
# 要按规范算 `header.signature`（SHA-1）。用 `sha1` 而不是自己写一份：
# 它已经在传递依赖里，许可闸门早已覆盖。CLI 与 server 的 dev-dependencies
# 里是同一条注释、同一个理由 —— 三个 crate 引的是**同一份样本**。
sha1 = { workspace = true }

[lints]
workspace = true
