version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bitflip-analyze = { workspace = true }
bitflip-arch = { workspace = true }
bitflip-debug = { workspace = true }
bitflip-loader = { workspace = true }
bitflip-project = { workspace = true }
bitflip-signature = { workspace = true }
bitflip-symbols.workspace = true
serde = { workspace = true }
# 导出（M9）要用它序列化。**刻意不做成 feature**：JSON 导出是交付物的一部分，
# 不是可选项 —— 做成 optional 只会让"导不出来"变成一种编译期配置。
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1.11.0"
tempfile = { workspace = true }

[lints]
workspace = true
